name: 콘래드 예약 체크

on:
  schedule:
    - cron: "*/5 * * * *"  # 5분마다 (GitHub 사정으로 몇 분씩 늦게 실행될 수 있음)
  workflow_dispatch:       # Actions 탭에서 수동 실행

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # 지난 실행의 상태(seen_items.json)를 불러와서 중복 알림 방지
      - uses: actions/cache/restore@v4
        with:
          path: seen_items.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python3 check_booking.py --date 2026-12-19 --people 10
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_items.json
          key: state-${{ github.run_id }}
